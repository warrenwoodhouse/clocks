<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2023 Omega Seamaster Professional Diver 300M Chronograph Watch Clock</title>
    <style>
        /* Base page styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a; /* Dark background to match the watch aesthetic */
            margin: 0;
            font-family: sans-serif;
        }

        /* Container for the watch image and hands */
        .watch-container {
            position: relative;
            width: 400px; /* Adjust size as needed */
            height: 650px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background watch image */
        .watch-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        /* Wrapper for the hands. 
           NOTE: 'top' is set to roughly 47.5% because the center of the dial 
           is slightly offset from the exact vertical center of the image due to the strap. 
           You can tweak this percentage to perfectly align the pivot point. */
        .hands-wrapper {
            position: absolute;
            top: 47.5%; 
            left: 50%;
            width: 0;
            height: 0;
            z-index: 2;
        }

        /* Generic styling for all clock hands */
        .hand {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
            /* Smooth sweeping motion for the hands */
            transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }

        /* Specific styles for Hour, Minute, and Second hands */
        .hour-hand {
            width: 10px;
            height: 70px;
            background-color: #ffffff;
            margin-left: -5px; /* Half of the width to center it */
            border: 1px solid #888;
        }

        .minute-hand {
            width: 8px;
            height: 110px;
            background-color: #ffffff;
            margin-left: -4px;
            border: 1px solid #888;
        }

        .second-hand {
            width: 2px;
            height: 130px;
            background-color: #d3a77b; /* Matches the tan/gold accents on the dial */
            margin-left: -1px;
        }

        /* The tail of the second hand that extends past the center */
        .second-hand::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 0;
            width: 2px;
            height: 25px;
            background-color: #d3a77b;
        }

        /* The center pivot dot */
        .center-dot {
            position: absolute;
            top: 47.5%;
            left: 50%;
            width: 14px;
            height: 14px;
            background-color: #222;
            border: 2px solid #d3a77b;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="watch-container">
        <img src="watch.png" alt="Omega Watch Face" class="watch-bg">
        
        <div class="hands-wrapper">
            <div class="hand hour-hand" id="hour"></div>
            <div class="hand minute-hand" id="minute"></div>
            <div class="hand second-hand" id="second"></div>
        </div>
        
        <div class="center-dot"></div>
    </div>

    <script>
        // Function to calculate time and update the hand rotations
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let milliseconds = now.getMilliseconds();

            // Calculate degrees for each hand
            // Adding fractions allows for smooth, continuous movement rather than ticking
            const hourAngle = (hours % 12) * 30 + (minutes * 0.5);
            const minuteAngle = (minutes * 6) + (seconds * 0.1);
            
            // The second hand ticks smoothly combining seconds and milliseconds
            const secondAngle = (seconds * 6) + (milliseconds * 0.006);

            // Apply the rotations via CSS transforms
            document.getElementById('hour').style.transform = `rotate(${hourAngle}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteAngle}deg)`;
            document.getElementById('second').style.transform = `rotate(${secondAngle}deg)`;
        }

        // Run the clock update frequently for a smooth sweeping second hand
        setInterval(updateClock, 50);
        updateClock(); // Initialize immediately on load
    </script>

</body>
</html>
